server:
  port: 8080

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/ecommerce

  cloud:
    gateway:
      mvc:
        routes:

          - id: product-service
            uri: http://localhost:8081
            predicates:
              - Path=/api/products/**

          - id: order-service
            uri: http://localhost:8082
            predicates:
              - Path=/api/orders/**

          - id: inventory-service
            uri: http://localhost:8083
            predicates:
              - Path=/api/inventory/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics