spring.application.name=order-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/orderdb
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# External service URLs
product.service.url=http://localhost:8081
inventory.service.url=http://localhost:8083

# Circuit Breaker - default configuration
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.configs.default.ignore-exceptions=org.springframework.web.client.HttpClientErrorException

# Circuit Breaker instances
resilience4j.circuitbreaker.instances.productService.base-config=default
resilience4j.circuitbreaker.instances.inventoryService.base-config=default


# Retry - default configuration
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=500ms

resilience4j.retry.configs.default.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException

# Retry instances
resilience4j.retry.instances.productService.base-config=default
resilience4j.retry.instances.inventoryService.base-config=default

#management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents,retries,retryevents

# Kafka Producer
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
